name: Mutation testing

on:
  schedule:
    - cron: "11 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read # checkout only

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  stryker:
    name: Stryker.NET (report only)
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Mutate PaperRoute.Core
        working-directory: tests/PaperRoute.Core.Tests
        run: |
          dotnet tool restore
          dotnet stryker --project PaperRoute.Core.csproj --reporter html --reporter progress
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stryker-report
          path: tests/PaperRoute.Core.Tests/StrykerOutput
          retention-days: 30
